# Автодеплой статического сайта на хостинг Рег.ру по FTP/FTPS.
# Секреты: Settings → Secrets and variables → Actions → New repository secret

name: Deploy to Reg.ru (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ftp
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize FTP server directory
        id: ftpdir
        env:
          SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          dir="$SERVER_DIR"
          case "$dir" in */) ;; *) dir="${dir}/" ;; esac
          echo "path=$dir" >> "$GITHUB_OUTPUT"

      - name: Upload site to hosting
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: ${{ steps.ftpdir.outputs.path }}
          log-level: minimal
          exclude: |
            **/.git*
            **/.git/**
            **/.github/**
            **/.cursor/**
            **/_preview/**
            **/assets/images/draft/**
            **/README.md
