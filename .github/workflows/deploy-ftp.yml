# Автодеплой статического сайта на хостинг Рег.ру по FTP/FTPS.
# Секреты: Settings → Secrets and variables → Actions → New repository secret

name: Deploy to Reg.ru (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      clean_slate:
        description: Полная перезаливка (сброс состояния FTP-Deploy)
        type: boolean
        default: false

concurrency:
  group: deploy-ftp
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write SMTP config for lead form
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          python3 <<'PY'
          import os
          from pathlib import Path
          user = os.environ.get("SMTP_USER") or "a50petro@yandex.ru"
          password = os.environ.get("SMTP_PASS") or ""
          if not password:
              print("SMTP_PASS not set — lead.php will use mail() via forms@petr-alekseev.ru")
              raise SystemExit(0)
          def php_str(s: str) -> str:
              return "'" + s.replace("\\", "\\\\").replace("'", "\\'") + "'"

          lines = [
              "<?php",
              "return [",
              f"  'host' => {php_str('ssl://smtp.yandex.ru')},",
              "  'port' => 465,",
              f"  'user' => {php_str(user)},",
              f"  'pass' => {php_str(password)},",
              f"  'from' => {php_str(user)},",
              f"  'from_name' => {php_str('Сайт petr-alekseev.ru')},",
              "];",
              "",
          ]
          Path("api/smtp.local.php").write_text("\n".join(lines), encoding="utf-8")
          print(f"Wrote api/smtp.local.php for SMTP user {user}")
          PY

      - name: Normalize FTP server directory
        id: ftpdir
        env:
          SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          dir="$SERVER_DIR"
          case "$dir" in */) ;; *) dir="${dir}/" ;; esac
          echo "path=$dir" >> "$GITHUB_OUTPUT"

      - name: Upload site to hosting
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: ${{ steps.ftpdir.outputs.path }}
          log-level: verbose
          dangerous-clean-slate: ${{ github.event_name == 'workflow_dispatch' && inputs.clean_slate }}
          exclude: |
            **/.git*
            **/.git/**
            **/.github/**
            **/.cursor/**
            **/_preview/**
            **/assets/images/draft/**
            **/blog/_article-template.html
            **/blog/КАК-ДОБАВИТЬ-СТАТЬЮ.txt
            **/README.md
            **/tools/**
            **/*.md
            **/CNAME
            **/.env*
            **/YANDEX-API.md
            **/.seo-reports/**
            **/*.bundle

      - name: Verify live homepage
        run: |
          expected=$(wc -c < index.html | tr -d ' ')
          for attempt in 1 2 3; do
            actual=$(curl -fsSIL "https://petr-alekseev.ru/index.html" | awk 'tolower($1)=="content-length:" {print $2}' | tr -d '\r')
            if [ "$actual" = "$expected" ]; then
              echo "OK: index.html on site is ${actual} bytes"
              exit 0
            fi
            echo "Attempt ${attempt}: expected ${expected}, got ${actual:-unknown}; retry in 15s"
            sleep 15
          done
          echo "::error::Сайт не обновился. Проверьте секрет FTP_SERVER_DIR (корень сайта в ISPmanager, обычно www/petr-alekseev.ru/)."
          exit 1

      - name: Notify Yandex IndexNow
        continue-on-error: true
        run: |
          python3 <<'PY'
          import json, re, urllib.error, urllib.request
          from pathlib import Path

          key = "15cc1411bc624812835571494ad154e0"
          locs = re.findall(r"<loc>\s*([^<]+?)\s*</loc>", Path("sitemap.xml").read_text(encoding="utf-8"))
          payload = {
              "host": "petr-alekseev.ru",
              "key": key,
              "keyLocation": f"https://petr-alekseev.ru/{key}.txt",
              "urlList": locs,
          }
          body = json.dumps(payload, ensure_ascii=False).encode("utf-8")
          print("IndexNow payload:", body.decode("utf-8"))
          req = urllib.request.Request(
              "https://yandex.com/indexnow",
              data=body,
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  code = resp.getcode()
                  text = resp.read().decode("utf-8", errors="replace")
          except urllib.error.HTTPError as e:
              code = e.code
              text = e.read().decode("utf-8", errors="replace")
          except Exception as e:
              code = 0
              text = str(e)
          print(f"IndexNow HTTP status: {code}")
          print("IndexNow response body:")
          print(text)
          if code in (200, 202):
              print("IndexNow OK")
          else:
              print("IndexNow non-success status (deploy continues)")
          PY
