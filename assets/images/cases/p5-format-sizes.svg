<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" width="1280" height="460" role="img" aria-label="Сравнение площади магазинов Фасоль и Пятёрочка" font-family="Manrope, 'Segoe UI', Arial, sans-serif"><rect width="1280" height="460" fill="#f7f8f7"/><text x="40" y="52" font-size="26" font-weight="800" fill="#111a16" text-anchor="start">Площадь магазина по франшизе, м²</text><line x1="330.0" y1="110" x2="330.0" y2="330" stroke="#dfe6e2" stroke-width="2"/><text x="330.0" y="360" font-size="18" font-weight="600" fill="#6b7a73" text-anchor="middle">0</text><line x1="436.25" y1="110" x2="436.25" y2="330" stroke="#dfe6e2" stroke-width="2"/><text x="436.25" y="360" font-size="18" font-weight="600" fill="#6b7a73" text-anchor="middle">100</text><line x1="542.5" y1="110" x2="542.5" y2="330" stroke="#dfe6e2" stroke-width="2"/><text x="542.5" y="360" font-size="18" font-weight="600" fill="#6b7a73" text-anchor="middle">200</text><line x1="648.75" y1="110" x2="648.75" y2="330" stroke="#dfe6e2" stroke-width="2"/><text x="648.75" y="360" font-size="18" font-weight="600" fill="#6b7a73" text-anchor="middle">300</text><line x1="755.0" y1="110" x2="755.0" y2="330" stroke="#dfe6e2" stroke-width="2"/><text x="755.0" y="360" font-size="18" font-weight="600" fill="#6b7a73" text-anchor="middle">400</text><line x1="861.25" y1="110" x2="861.25" y2="330" stroke="#dfe6e2" stroke-width="2"/><text x="861.25" y="360" font-size="18" font-weight="600" fill="#6b7a73" text-anchor="middle">500</text><line x1="967.5" y1="110" x2="967.5" y2="330" stroke="#dfe6e2" stroke-width="2"/><text x="967.5" y="360" font-size="18" font-weight="600" fill="#6b7a73" text-anchor="middle">600</text><line x1="1073.75" y1="110" x2="1073.75" y2="330" stroke="#dfe6e2" stroke-width="2"/><text x="1073.75" y="360" font-size="18" font-weight="600" fill="#6b7a73" text-anchor="middle">700</text><line x1="1180.0" y1="110" x2="1180.0" y2="330" stroke="#dfe6e2" stroke-width="2"/><text x="1180.0" y="360" font-size="18" font-weight="600" fill="#6b7a73" text-anchor="middle">800</text><text x="40" y="160" font-size="22" font-weight="800" fill="#111a16" text-anchor="start">«Фасоль» METRO</text><text x="40" y="186" font-size="16" font-weight="500" fill="#6b7a73" text-anchor="start">магазин у дома</text><rect x="393.75" y="138" width="148.75" height="56" rx="10" fill="#2a9d85" stroke="none" stroke-width="2" /><text x="468.125" y="174" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">60–200 м²</text><text x="40" y="260" font-size="22" font-weight="800" fill="#111a16" text-anchor="start">«Пятёрочка»</text><text x="40" y="286" font-size="16" font-weight="500" fill="#6b7a73" text-anchor="start">франшиза X5</text><rect x="648.75" y="238" width="531.25" height="56" rx="10" fill="#e52825" stroke="none" stroke-width="2" /><text x="914.375" y="274" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">300–800 м²</text><text x="40" y="420" font-size="18" font-weight="500" fill="#4a5a53" text-anchor="start">Чем больше площадь, тем больше зон, касс и товарных групп в проекте.</text></svg>