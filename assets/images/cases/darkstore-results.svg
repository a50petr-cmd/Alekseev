<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" width="1280" height="620" role="img" aria-label="Было и стало: сборка, списания, операционные затраты" font-family="Manrope, 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1280" height="620" fill="#f7f8f7"/><text x="40" y="56" font-size="22" font-weight="700" fill="#101410">Результат за ~6 месяцев: было и стало</text><rect x="330" y="78" width="16" height="16" rx="3" fill="#b8c2ba"/><text x="354" y="91" font-size="14" fill="#334038">было</text><rect x="420" y="78" width="16" height="16" rx="3" fill="#0f766e"/><text x="444" y="91" font-size="14" fill="#334038">стало</text><text x="40" y="172" font-size="18" font-weight="700" fill="#101410">Сборка заказа</text><text x="40" y="196" font-size="13" fill="#5a665c">мин:сек</text><rect x="330" y="150" width="820" height="34" rx="6" fill="#b8c2ba"/><text x="1138" y="173" text-anchor="end" font-size="16" font-weight="700" fill="#101410">5:00</text><rect x="330" y="192" width="429" height="34" rx="6" fill="#0f766e"/><text x="771" y="215" font-size="16" font-weight="700" fill="#0f766e">2:37</text><text x="40" y="312" font-size="18" font-weight="700" fill="#101410">Списания</text><text x="40" y="336" font-size="13" fill="#5a665c">доля, %</text><rect x="330" y="290" width="820" height="34" rx="6" fill="#b8c2ba"/><text x="1138" y="313" text-anchor="end" font-size="16" font-weight="700" fill="#101410">7%</text><rect x="330" y="332" width="164" height="34" rx="6" fill="#0f766e"/><text x="506" y="355" font-size="16" font-weight="700" fill="#0f766e">1,4%</text><text x="40" y="452" font-size="18" font-weight="700" fill="#101410">Операционные затраты</text><text x="40" y="476" font-size="13" fill="#5a665c">индекс, было = 100</text><rect x="330" y="430" width="820" height="34" rx="6" fill="#b8c2ba"/><text x="1138" y="453" text-anchor="end" font-size="16" font-weight="700" fill="#101410">100</text><rect x="330" y="472" width="410" height="34" rx="6" fill="#0f766e"/><text x="752" y="495" font-size="16" font-weight="700" fill="#0f766e">50</text><text x="40" y="596" font-size="13" fill="#5a665c">Затраты показаны индексом: в кейсе подтверждено снижение в 2 раза, абсолютные суммы не раскрываются.</text></svg>