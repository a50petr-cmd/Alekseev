<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="План зала магазина у дома с путём покупателя" font-family="Manrope, 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#0f766e"/></marker>
<marker id="m" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto"><path d="M0,1L9,5L0,9z" fill="#0f766e"/></marker></defs>
<rect width="1280" height="720" fill="#f7f8f7"/><text x="60" y="50" font-size="20" font-weight="700" fill="#101410">План зала и путь покупателя</text>
<line x1="620" y1="44" x2="670" y2="44" stroke="#0f766e" stroke-width="3.5" stroke-dasharray="10 7"/>
<text x="680" y="49" font-size="14" fill="#334038">путь покупателя</text><rect x="60" y="90" width="800" height="560" fill="#ffffff" stroke="#101410" stroke-width="4"/><rect x="420" y="646" width="80" height="8" fill="#f7f8f7"/><rect x="100" y="96" width="600" height="36" rx="4" fill="#7fc8c0" stroke="#101410" stroke-width="1.2"/><rect x="68" y="470" width="44" height="128" rx="4" fill="#a9c9e8" stroke="#101410" stroke-width="1.2"/><rect x="68" y="154" width="56" height="272" rx="4" fill="#9bc76a" stroke="#101410" stroke-width="1.2"/><rect x="200" y="218" width="400" height="40" rx="4" fill="#e9e2d4" stroke="#101410" stroke-width="1.2"/><rect x="200" y="326" width="400" height="40" rx="4" fill="#e9e2d4" stroke="#101410" stroke-width="1.2"/><rect x="200" y="434" width="400" height="40" rx="4" fill="#e9e2d4" stroke="#101410" stroke-width="1.2"/><rect x="708" y="94" width="148" height="196" rx="4" fill="#cfd6d1" stroke="#101410" stroke-width="1.2"/><rect x="740" y="338" width="104" height="40" rx="4" fill="#e0a43a" stroke="#101410" stroke-width="1.2"/><rect x="140" y="554" width="208" height="40" rx="4" fill="#d9b98c" stroke="#101410" stroke-width="1.2"/><rect x="560" y="570" width="28" height="24" rx="4" fill="#ffffff" stroke="#101410" stroke-width="1.2"/><rect x="604" y="570" width="28" height="24" rx="4" fill="#ffffff" stroke="#101410" stroke-width="1.2"/><rect x="648" y="570" width="28" height="24" rx="4" fill="#ffffff" stroke="#101410" stroke-width="1.2"/><rect x="708" y="554" width="88" height="40" rx="4" fill="#2b3530" stroke="#101410" stroke-width="1.2"/><text x="400" y="120" font-size="14" font-weight="600" fill="#101410" text-anchor="middle">Холодильные горки</text><text x="96" y="298" font-size="13" font-weight="600" fill="#101410" text-anchor="middle">Овощи</text><text x="96" y="314" font-size="13" font-weight="600" fill="#101410" text-anchor="middle">фрукты</text><text x="90" y="538" font-size="13" font-weight="600" fill="#101410" text-anchor="middle">Лари</text><text x="400" y="244" font-size="13" font-weight="500" fill="#5a665c" text-anchor="middle">Бакалея</text><text x="400" y="352" font-size="13" font-weight="500" fill="#5a665c" text-anchor="middle">Бакалея</text><text x="400" y="460" font-size="13" font-weight="500" fill="#5a665c" text-anchor="middle">Бакалея</text><text x="782" y="194" font-size="14" font-weight="600" fill="#101410" text-anchor="middle">Склад</text><text x="782" y="210" font-size="13" font-weight="500" fill="#334038" text-anchor="middle">приёмка</text><text x="792" y="364" font-size="13" font-weight="600" fill="#101410" text-anchor="middle">Пиво</text><text x="244" y="580" font-size="13" font-weight="600" fill="#101410" text-anchor="middle">Food to go</text><text x="618" y="618" font-size="12" font-weight="500" fill="#334038" text-anchor="middle">Кассы самообслуж.</text><text x="752" y="618" font-size="12" font-weight="500" fill="#334038" text-anchor="middle">Касса</text><text x="460" y="680" font-size="15" font-weight="700" fill="#0f766e" text-anchor="middle">Вход</text><path d="M460,658 L460,610 L372,530 L156,514 L156,178 L676,178 L660,274 L172,274 L172,386 L628,386 L716,410 L716,510 L616,538" fill="none" stroke="#0f766e" stroke-width="3.5" stroke-dasharray="10 7" stroke-linejoin="round" marker-end="url(#a)" marker-mid="url(#m)"/><circle cx="364" cy="574" r="13" fill="#0f766e" stroke="#fff" stroke-width="2.5"/><text x="364" y="579" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text><circle cx="716" cy="114" r="13" fill="#0f766e" stroke="#fff" stroke-width="2.5"/><text x="716" y="119" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text><circle cx="540" cy="582" r="13" fill="#0f766e" stroke="#fff" stroke-width="2.5"/><text x="540" y="587" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text><text x="900" y="104" font-size="17" font-weight="700" fill="#101410">Логика планировки</text><circle cx="912" cy="137" r="12" fill="#0f766e"/><text x="912" y="142" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text><text x="932" y="142" font-size="14" fill="#334038">Импульсные категории — у</text><text x="932" y="161" font-size="14" fill="#334038">входа: кофе, выпечка,</text><text x="932" y="180" font-size="14" fill="#334038">тандыр.</text><circle cx="912" cy="237" r="12" fill="#0f766e"/><text x="912" y="242" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text><text x="932" y="242" font-size="14" fill="#334038">Товары ежедневного спроса</text><text x="932" y="261" font-size="14" fill="#334038">— в глубине зала:</text><text x="932" y="280" font-size="14" fill="#334038">покупатель проходит мимо</text><text x="932" y="299" font-size="14" fill="#334038">полок.</text><circle cx="912" cy="337" r="12" fill="#0f766e"/><text x="912" y="342" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text><text x="932" y="342" font-size="14" fill="#334038">Кассы — на выходе: путь к</text><text x="932" y="361" font-size="14" fill="#334038">ним проходит мимо</text><text x="932" y="380" font-size="14" fill="#334038">разливного пива.</text><text x="900" y="650" font-size="12" fill="#5a665c">Схема-пример, не план</text><text x="900" y="666" font-size="12" fill="#5a665c">конкретного магазина.</text></svg>