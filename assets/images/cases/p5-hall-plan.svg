<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="План зала магазина Пятёрочка и путь покупателя" font-family="Manrope, 'Segoe UI', Arial, sans-serif"><rect width="1280" height="720" fill="#f7f8f7"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0e7a62"/></marker></defs><text x="40" y="52" font-size="26" font-weight="800" fill="#111a16" text-anchor="start">Магазин «Пятёрочка» 300–800 м²: зоны зала и путь покупателя</text><rect x="40" y="80" width="860" height="590" rx="14" fill="#fff" stroke="#9aa8a1" stroke-width="3" /><rect x="60" y="640" width="150" height="30" rx="4" fill="#0e7a62" stroke="none" stroke-width="2" /><text x="135" y="662" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">Вход</text><rect x="240" y="566" width="52" height="40" rx="6" fill="#d6ddd9" stroke="#9aa8a1" stroke-width="2" /><rect x="304" y="566" width="52" height="40" rx="6" fill="#d6ddd9" stroke="#9aa8a1" stroke-width="2" /><rect x="368" y="566" width="52" height="40" rx="6" fill="#d6ddd9" stroke="#9aa8a1" stroke-width="2" /><rect x="432" y="566" width="52" height="40" rx="6" fill="#d6ddd9" stroke="#9aa8a1" stroke-width="2" /><text x="250" y="548" font-size="16" font-weight="800" fill="#4a5a53" text-anchor="start">Кассы</text><rect x="60" y="100" width="300" height="50" rx="8" fill="#d9ecf5" stroke="#9cc3d6" stroke-width="2" /><text x="210" y="132" font-size="17" font-weight="700" fill="#2d5a73" text-anchor="middle">Молочка</text><rect x="370" y="100" width="250" height="50" rx="8" fill="#f6d5d0" stroke="#d9a39b" stroke-width="2" /><text x="495" y="132" font-size="17" font-weight="700" fill="#7a2f27" text-anchor="middle">Мясо и птица</text><rect x="630" y="100" width="250" height="50" rx="8" fill="#e0e6e2" stroke="#b3beb8" stroke-width="2" /><text x="755" y="132" font-size="17" font-weight="700" fill="#4a5a53" text-anchor="middle">Заморозка</text><rect x="60" y="170" width="90" height="300" rx="8" fill="#d7ecd0" stroke="#a3c99a" stroke-width="2" /><g transform="translate(105,330) rotate(-90)"><text x="0" y="6" font-size="17" font-weight="700" fill="#3d6b34" text-anchor="middle">Овощи и фрукты</text></g><rect x="200" y="200" width="150" height="50" rx="8" fill="#e9eeeb" stroke="#c3cdc8" stroke-width="2" /><rect x="390" y="200" width="150" height="50" rx="8" fill="#e9eeeb" stroke="#c3cdc8" stroke-width="2" /><rect x="580" y="200" width="150" height="50" rx="8" fill="#e9eeeb" stroke="#c3cdc8" stroke-width="2" /><rect x="200" y="300" width="150" height="50" rx="8" fill="#e9eeeb" stroke="#c3cdc8" stroke-width="2" /><rect x="390" y="300" width="150" height="50" rx="8" fill="#e9eeeb" stroke="#c3cdc8" stroke-width="2" /><rect x="580" y="300" width="150" height="50" rx="8" fill="#e9eeeb" stroke="#c3cdc8" stroke-width="2" /><rect x="200" y="400" width="150" height="50" rx="8" fill="#e9eeeb" stroke="#c3cdc8" stroke-width="2" /><rect x="390" y="400" width="150" height="50" rx="8" fill="#e9eeeb" stroke="#c3cdc8" stroke-width="2" /><rect x="580" y="400" width="150" height="50" rx="8" fill="#e9eeeb" stroke="#c3cdc8" stroke-width="2" /><text x="275" y="232" font-size="16" font-weight="700" fill="#6b7a73" text-anchor="middle">Бакалея</text><text x="465" y="232" font-size="16" font-weight="700" fill="#6b7a73" text-anchor="middle">Чай, кофе</text><text x="655" y="232" font-size="16" font-weight="700" fill="#6b7a73" text-anchor="middle">Напитки</text><text x="275" y="332" font-size="16" font-weight="700" fill="#6b7a73" text-anchor="middle">Крупы, макароны</text><text x="465" y="332" font-size="16" font-weight="700" fill="#6b7a73" text-anchor="middle">Кондитерка</text><text x="655" y="332" font-size="16" font-weight="700" fill="#6b7a73" text-anchor="middle">Бытовая химия</text><text x="275" y="432" font-size="16" font-weight="700" fill="#6b7a73" text-anchor="middle">Детское</text><text x="465" y="432" font-size="16" font-weight="700" fill="#6b7a73" text-anchor="middle">Товары для дома</text><text x="655" y="432" font-size="16" font-weight="700" fill="#6b7a73" text-anchor="middle">Товары недели</text><rect x="740" y="520" width="140" height="130" rx="10" fill="#e9e3d4" stroke="#c9bd9a" stroke-width="2" /><text x="810" y="585" font-size="18" font-weight="800" fill="#7a6a3a" text-anchor="middle">Склад</text><text x="810" y="610" font-size="16" font-weight="600" fill="#7a6a3a" text-anchor="middle">и приёмка</text><rect x="880" y="555" width="20" height="60" rx="3" fill="#e8b04a" stroke="none" stroke-width="2" /><path d="M135 640 V520 H175 V175 H745 V275 H175 V375 H745 V475 H290 V548" fill="none" stroke="#0e7a62" stroke-width="4" stroke-dasharray="10 8" stroke-linejoin="round" marker-end="url(#a)"/><circle cx="135" cy="640" r="10" fill="#0e7a62" stroke="none" stroke-width="2" opacity="1"/><circle cx="105" cy="215" r="18" fill="#0e7a62" stroke="none" stroke-width="2" opacity="1"/><text x="105" y="222" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">1</text><circle cx="80" cy="125" r="18" fill="#0e7a62" stroke="none" stroke-width="2" opacity="1"/><text x="80" y="132" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">2</text><circle cx="212" cy="212" r="18" fill="#0e7a62" stroke="none" stroke-width="2" opacity="1"/><text x="212" y="219" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">3</text><circle cx="215" cy="586" r="18" fill="#0e7a62" stroke="none" stroke-width="2" opacity="1"/><text x="215" y="593" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">4</text><circle cx="810" cy="545" r="18" fill="#0e7a62" stroke="none" stroke-width="2" opacity="1"/><text x="810" y="552" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">5</text><rect x="930" y="80" width="310" height="590" rx="14" fill="#fff" stroke="#d6dfda" stroke-width="2" /><text x="955" y="122" font-size="22" font-weight="800" fill="#111a16" text-anchor="start">Как устроен зал</text><circle cx="970" cy="170" r="18" fill="#0e7a62" stroke="none" stroke-width="2" opacity="1"/><text x="970" y="177" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="1002" y="168" font-size="19" font-weight="800" fill="#111a16" text-anchor="start">Овощи у входа</text><text x="1002" y="192" font-size="16" font-weight="500" fill="#4a5a53" text-anchor="start">привлекают и задают тон</text><circle cx="970" cy="254" r="18" fill="#0e7a62" stroke="none" stroke-width="2" opacity="1"/><text x="970" y="261" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="1002" y="252" font-size="19" font-weight="800" fill="#111a16" text-anchor="start">Холодная стена</text><text x="1002" y="276" font-size="16" font-weight="500" fill="#4a5a53" text-anchor="start">молочка, мясо, заморозка</text><circle cx="970" cy="338" r="18" fill="#0e7a62" stroke="none" stroke-width="2" opacity="1"/><text x="970" y="345" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="1002" y="336" font-size="19" font-weight="800" fill="#111a16" text-anchor="start">Островные стеллажи</text><text x="1002" y="360" font-size="16" font-weight="500" fill="#4a5a53" text-anchor="start">сухие и непродовольств.</text><circle cx="970" cy="422" r="18" fill="#0e7a62" stroke="none" stroke-width="2" opacity="1"/><text x="970" y="429" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="1002" y="420" font-size="19" font-weight="800" fill="#111a16" text-anchor="start">Кассы на выходе</text><text x="1002" y="444" font-size="16" font-weight="500" fill="#4a5a53" text-anchor="start">4 кассы в ряд</text><circle cx="970" cy="506" r="18" fill="#0e7a62" stroke="none" stroke-width="2" opacity="1"/><text x="970" y="513" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">5</text><text x="1002" y="504" font-size="19" font-weight="800" fill="#111a16" text-anchor="start">Склад и приёмка</text><text x="1002" y="528" font-size="16" font-weight="500" fill="#4a5a53" text-anchor="start">въезд для машин</text><text x="955" y="640" font-size="20" font-weight="800" fill="#0e7a62" text-anchor="start">Площадь 300–800 м²</text><text x="40" y="704" font-size="16" font-weight="500" fill="#6b7a73" text-anchor="start">Схема-пример: принцип зонирования, не план конкретного магазина.</text></svg>