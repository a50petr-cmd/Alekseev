" fill="#4a5a53" text-anchor="start">эскалатор, фудкорт</text><circle cx="970" cy="342" r="18" fill="#e8b04a" stroke="none" stroke-width="2" opacity="1"/><text x="970" y="349" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="1002" y="340" font-size="20" font-weight="800" fill="#111a16" text-anchor="start">Поток средний</text><text x="1002" y="366" font-size="17" font-weight="500" fill="#4a5a53" text-anchor="start">если аренда ниже</text><circle cx="970" cy="428" r="18" fill="#c0392b" stroke="none" stroke-width="2" opacity="1"/><text x="970" y="435" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="1002" y="426" font-size="20" font-weight="800" fill="#111a16" text-anchor="start">Отказ</text><text x="1002" y="452" font-size="17" font-weight="500" fill="#4a5a53" text-anchor="start">тупик, низкий поток</text><text x="955" y="540" font-size="20" font-weight="800" fill="#111a16" text-anchor="start">Что делали до договора</text><text x="955" y="574" font-size="17" font-weight="500" fill="#4a5a53" text-anchor="start">Замеры трафика в разные дни</text><text x="955" y="606" font-size="17" font-weight="500" fill="#4a5a53" text-anchor="start">Обмеры помещения</text><text x="955" y="638" font-size="17" font-weight="500" fill="#4a5a53" text-anchor="start">Переговоры с торговым центром</text><text x="40" y="708" font-size="16" font-weight="500" fill="#6b7a73" text-anchor="start">Схема-пример: принцип выбора места, не план конкретного торгового центра.</text></svg>