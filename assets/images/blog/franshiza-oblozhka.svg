<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e7cf"/>
      <stop offset="1" stop-color="#f1d7b3"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset="1" stop-color="#ffd98a"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1330" cy="170" r="80" fill="#f7c46c" opacity="0.8"/>
  <!-- background houses -->
  <rect x="0" y="250" width="260" height="500" fill="#d9b48f"/>
  <rect x="1360" y="230" width="240" height="520" fill="#cfa883"/>
  <g fill="#b98d68">
    <rect x="40" y="300" width="60" height="70"/><rect x="150" y="300" width="60" height="70"/>
    <rect x="40" y="420" width="60" height="70"/><rect x="150" y="420" width="60" height="70"/>
    <rect x="40" y="540" width="60" height="70"/><rect x="150" y="540" width="60" height="70"/>
    <rect x="1400" y="290" width="60" height="70"/><rect x="1500" y="290" width="60" height="70"/>
    <rect x="1400" y="410" width="60" height="70"/><rect x="1500" y="410" width="60" height="70"/>
    <rect x="1400" y="530" width="60" height="70"/><rect x="1500" y="530" width="60" height="70"/>
  </g>
  <!-- store building -->
  <rect x="330" y="200" width="940" height="560" fill="#e9dccb"/>
  <rect x="330" y="200" width="940" height="40" fill="#cbb79d"/>
  <!-- upper windows -->
  <g fill="#c9d6dd" stroke="#a89277" stroke-width="6">
    <rect x="400" y="270" width="120" height="90"/><rect x="600" y="270" width="120" height="90"/>
    <rect x="880" y="270" width="120" height="90"/><rect x="1080" y="270" width="120" height="90"/>
  </g>
  <!-- old sign leaning on wall (grey, faded) -->
  <g transform="rotate(-8 1130 690)">
    <rect x="1010" y="610" width="250" height="90" rx="8" fill="#9a9a96"/>
    <rect x="1030" y="630" width="210" height="50" rx="6" fill="#b5b4ae"/>
  </g>
  <!-- new sign being raised -->
  <rect x="470" y="395" width="660" height="110" rx="14" fill="#2f6f5e"/>
  <rect x="495" y="418" width="610" height="64" rx="10" fill="#3f8c76"/>
  <circle cx="545" cy="450" r="20" fill="#f2b84b"/>
  <rect x="585" y="438" width="300" height="24" rx="12" fill="#cfe7dc" opacity="0.9"/>
  <!-- storefront -->
  <rect x="420" y="530" width="760" height="230" fill="#7a5a43"/>
  <rect x="445" y="555" width="300" height="205" fill="url(#win)"/>
  <rect x="855" y="555" width="300" height="205" fill="url(#win)"/>
  <rect x="760" y="560" width="80" height="200" fill="#5b4232"/>
  <circle cx="825" cy="665" r="6" fill="#e6c27a"/>
  <!-- shelves in windows -->
  <g fill="#c98a4b">
    <rect x="465" y="620" width="260" height="8"/><rect x="465" y="690" width="260" height="8"/>
    <rect x="875" y="620" width="260" height="8"/><rect x="875" y="690" width="260" height="8"/>
  </g>
  <g>
    <rect x="480" y="585" width="26" height="35" fill="#e46b4f"/><rect x="515" y="595" width="22" height="25" fill="#5ea3c7"/>
    <rect x="548" y="580" width="24" height="40" fill="#f2b84b"/><rect x="585" y="590" width="30" height="30" fill="#7fb069"/>
    <rect x="630" y="585" width="22" height="35" fill="#e46b4f"/><rect x="665" y="592" width="40" height="28" fill="#d9c1a0"/>
    <rect x="890" y="585" width="26" height="35" fill="#5ea3c7"/><rect x="925" y="595" width="30" height="25" fill="#f2b84b"/>
    <rect x="965" y="580" width="22" height="40" fill="#7fb069"/><rect x="1000" y="590" width="40" height="30" fill="#e46b4f"/>
    <rect x="1050" y="584" width="24" height="36" fill="#5ea3c7"/><rect x="1085" y="592" width="30" height="28" fill="#d9c1a0"/>
    <rect x="490" y="655" width="40" height="35" fill="#f4f1ea"/><rect x="540" y="660" width="30" height="30" fill="#7fb069"/>
    <rect x="900" y="655" width="40" height="35" fill="#f4f1ea"/><rect x="950" y="660" width="30" height="30" fill="#e46b4f"/>
  </g>
  <!-- ladder -->
  <g stroke="#8a6a4a" stroke-width="10" stroke-linecap="round">
    <line x1="1180" y1="760" x2="1120" y2="420"/>
    <line x1="1240" y1="760" x2="1180" y2="420"/>
    <line x1="1168" y1="690" x2="1228" y2="690"/>
    <line x1="1156" y1="620" x2="1216" y2="620"/>
    <line x1="1144" y1="550" x2="1204" y2="550"/>
    <line x1="1132" y1="480" x2="1192" y2="480"/>
  </g>
  <!-- worker on ladder holding sign -->
  <g>
    <rect x="1150" y="470" width="36" height="70" rx="12" fill="#2b4c7e"/>
    <circle cx="1168" cy="448" r="22" fill="#e9b996"/>
    <path d="M1144 440 q24 -30 48 0 z" fill="#f2b84b"/>
    <line x1="1152" y1="485" x2="1120" y2="460" stroke="#2b4c7e" stroke-width="14" stroke-linecap="round"/>
    <line x1="1184" y1="490" x2="1205" y2="530" stroke="#2b4c7e" stroke-width="14" stroke-linecap="round"/>
    <rect x="1152" y="540" width="14" height="45" fill="#33363d"/><rect x="1172" y="540" width="14" height="40" fill="#33363d"/>
  </g>
  <!-- ground -->
  <rect x="0" y="760" width="1600" height="140" fill="#b9a68f"/>
  <rect x="0" y="760" width="1600" height="14" fill="#a39079"/>
  <!-- shopper with bag thinking, holding calculator-like tablet -->
  <g transform="translate(260 560)">
    <rect x="-28" y="60" width="56" height="120" rx="20" fill="#c25b4a"/>
    <circle cx="0" cy="34" r="28" fill="#d9a380"/>
    <path d="M-30 26 q30 -40 60 0 q-10 -12 -30 -12 q-20 0 -30 12z" fill="#4a3428"/>
    <rect x="-24" y="180" width="18" height="60" fill="#3c3f47"/><rect x="6" y="180" width="18" height="60" fill="#3c3f47"/>
    <line x1="22" y1="85" x2="60" y2="110" stroke="#c25b4a" stroke-width="16" stroke-linecap="round"/>
    <rect x="50" y="90" width="50" height="66" rx="6" fill="#33363d"/>
    <g fill="#9fd3c7"><rect x="58" y="98" width="34" height="14" rx="2"/>
    <rect x="58" y="120" width="8" height="8"/><rect x="71" y="120" width="8" height="8"/><rect x="84" y="120" width="8" height="8"/>
    <rect x="58" y="134" width="8" height="8"/><rect x="71" y="134" width="8" height="8"/><rect x="84" y="134" width="8" height="8"/></g>
    <line x1="-22" y1="85" x2="-45" y2="150" stroke="#c25b4a" stroke-width="16" stroke-linecap="round"/>
    <path d="M-75 150 h50 l-6 60 h-38 z" fill="#e8d3a8"/>
    <rect x="-66" y="138" width="6" height="16" fill="#7fb069"/><rect x="-50" y="132" width="10" height="20" fill="#f4f1ea"/>
  </g>
  <!-- thought bubbles -->
  <circle cx="320" cy="520" r="10" fill="#fffaf0"/>
  <circle cx="345" cy="485" r="16" fill="#fffaf0"/>
  <g transform="translate(330 360)">
    <ellipse cx="40" cy="60" rx="95" ry="70" fill="#fffaf0"/>
    <!-- three bars: bad, mid, good -->
    <rect x="-10" y="80" width="22" height="30" fill="#e46b4f"/>
    <rect x="28" y="55" width="22" height="55" fill="#f2b84b"/>
    <rect x="66" y="25" width="22" height="85" fill="#7fb069"/>
  </g>
</svg>
